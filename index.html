<title>鉄不足セルフチェック｜Mlab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap">

<style>
/* ── tokens ── */
:root {
  --pink: #D4537E;
  --pink-light: #F9EEF3;
  --gold: #C8922A;
  --gold-light: #FDF6E8;
  --green: #6A9A3A;
  --green-light: #F0F7E8;
  --white: #FFFFFF;
  --bg: #FDF8F5;
  --text: #2D1F1F;
  --text-sub: #6B5555;
  --border: #E8D5CC;
  --card-bg: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1A1212;
    --text: #F0E8E0;
    --text-sub: #C4A898;
    --border: #3D2A2A;
    --card-bg: #241818;
    --pink-light: #2A1520;
    --gold-light: #241B0A;
    --green-light: #122010;
    --white: #241818;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1A1212;
  --text: #F0E8E0;
  --text-sub: #C4A898;
  --border: #3D2A2A;
  --card-bg: #241818;
  --pink-light: #2A1520;
  --gold-light: #241B0A;
  --green-light: #122010;
  --white: #241818;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  max-width: 480px;
  margin: 0 auto;
}

/* ── hero ── */
.hero {
  background: linear-gradient(160deg, #FFF0F5 0%, #FFF8F0 60%, #F8FFEF 100%);
  margin: 0 max(-16px, calc(-1 * env(safe-area-inset-left, 0px)));
  padding: 28px max(16px, env(safe-area-inset-left, 0px));
  text-align: center;
  border-bottom: 1px solid var(--border);
}
.hero img.logo {
  height: 48px;
  width: auto;
  margin-bottom: 16px;
}
.hero img.chara {
  width: 110px;
  height: auto;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 4px 16px rgba(212,83,126,0.18);
  margin-bottom: 12px;
}
.catchcopy {
  font-family: 'Noto Serif JP', serif;
  font-size: 14px;
  color: var(--pink);
  letter-spacing: 0.12em;
  margin-bottom: 6px;
}
.hero-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.4;
  margin-bottom: 4px;
}
.hero-sub {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.7;
}

/* ── section ── */
.section {
  padding: 20px 0;
}
.section-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 16px;
  font-weight: 700;
  color: var(--pink);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::before {
  content: '';
  display: block;
  width: 4px;
  height: 18px;
  background: var(--pink);
  border-radius: 2px;
  flex-shrink: 0;
}

/* ── checklist ── */
.check-intro {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 14px;
  line-height: 1.7;
  padding: 12px 14px;
  background: var(--pink-light);
  border-radius: 10px;
}
.check-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}
.check-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.check-item.checked {
  border-color: var(--pink);
  background: var(--pink-light);
}
.check-box {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color 0.2s, background 0.2s;
  margin-top: 1px;
}
.check-item.checked .check-box {
  border-color: var(--pink);
  background: var(--pink);
}
.check-mark {
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  display: none;
}
.check-item.checked .check-mark {
  display: block;
}
.check-label {
  font-size: 14px;
  line-height: 1.6;
  flex: 1;
}
.check-num {
  font-size: 10px;
  color: var(--text-sub);
  font-weight: 500;
  margin-bottom: 1px;
}

/* ── score bar ── */
.score-bar-wrap {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 6px;
  text-align: center;
}
.score-num {
  font-size: 42px;
  font-weight: 700;
  font-family: 'Noto Serif JP', serif;
  line-height: 1;
  margin-bottom: 4px;
}
.score-label {
  font-size: 13px;
  color: var(--text-sub);
  margin-bottom: 14px;
}
.bar-track {
  height: 12px;
  background: var(--border);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 6px;
}
.bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.5s ease, background 0.5s ease;
  width: 0%;
  background: var(--green);
}
.bar-labels {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: var(--text-sub);
}

/* ── result card ── */
.result-card {
  border-radius: 14px;
  padding: 18px 16px;
  margin-top: 16px;
  transition: opacity 0.4s, transform 0.4s;
}
.result-card.hidden {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}
.result-level {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
}
.result-desc {
  font-size: 13.5px;
  line-height: 1.75;
  margin-bottom: 12px;
}
.advice-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
  opacity: 0.75;
}
.advice-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.advice-list li {
  font-size: 13px;
  line-height: 1.6;
  padding-left: 18px;
  position: relative;
}
.advice-list li::before {
  content: '✦';
  position: absolute;
  left: 0;
  font-size: 9px;
  top: 4px;
  opacity: 0.7;
}

/* level colors */
.lv0 { background: var(--green-light); border: 1.5px solid var(--green); }
.lv0 .result-level { color: var(--green); }
.lv0 .result-badge { background: var(--green); }
.lv0 .advice-list li::before { color: var(--green); }

.lv1 { background: var(--gold-light); border: 1.5px solid var(--gold); }
.lv1 .result-level { color: var(--gold); }
.lv1 .result-badge { background: var(--gold); }
.lv1 .advice-list li::before { color: var(--gold); }

.lv2 { background: #FFF3ED; border: 1.5px solid #E8733A; }
.lv2 .result-level { color: #E8733A; }
.lv2 .result-badge { background: #E8733A; }
.lv2 .advice-list li::before { color: #E8733A; }

.lv3 { background: #FFF0F0; border: 1.5px solid var(--pink); }
.lv3 .result-level { color: var(--pink); }
.lv3 .result-badge { background: var(--pink); }
.lv3 .advice-list li::before { color: var(--pink); }

/* ── doctor card ── */
.doctor-card {
  margin: 24px 0;
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.doctor-card img {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--pink-light);
}
.doctor-message {
  text-align: center;
}
.doctor-name {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 6px;
}
.doctor-text {
  font-size: 14px;
  line-height: 1.75;
  color: var(--text);
}

/* ── CTA ── */
.cta-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 32px;
}
.cta-card {
  border-radius: 14px;
  padding: 18px 16px;
}
.cta-card-green { background: var(--card-bg); border: 2px solid var(--green); }
.cta-card-pink  { background: var(--card-bg); border: 2px solid var(--pink); }
.cta-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 4px;
}
.cta-card-green .cta-title { color: var(--green); }
.cta-card-pink  .cta-title { color: var(--pink); }
.cta-desc {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-sub);
  margin-bottom: 12px;
}
.cta-btn {
  display: block;
  text-align: center;
  text-decoration: none;
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  padding: 12px 20px;
  border-radius: 25px;
  background: linear-gradient(135deg, #C8922A 0%, #E8B84B 100%);
  box-shadow: 0 3px 12px rgba(200,146,42,0.35);
  transition: opacity 0.2s;
}
.cta-btn:active { opacity: 0.8; }
.cta-btn::after { content: ' →'; }

/* ── footer ── */
.footer {
  text-align: center;
  padding: 20px 0 32px;
  border-top: 1px solid var(--border);
}
.footer img {
  width: 56px;
  height: auto;
  opacity: 0.65;
  margin-bottom: 8px;
}
.footer-text {
  font-size: 11px;
  color: var(--text-sub);
}

/* ── reset btn ── */
.reset-btn {
  display: block;
  width: 100%;
  margin: 12px 0 0;
  padding: 10px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: transparent;
  color: var(--text-sub);
  font-size: 13px;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
}
.reset-btn:active { opacity: 0.6; }
</style>

  "疲れやすく、だるさが続く",
  "朝起きるのがつらい、寝ても眠い",
  "立ちくらみや、めまいがある",
  "動悸や、息切れを感じることがある",
  "頭痛が起きやすい",
  "集中力が続かない、ぼーっとする",
  "髪が抜けやすい、細くなってきた",
  "爪が割れやすい、縦筋が入る",
  "肌が乾燥しやすい、顔色が悪い",
  "冷え性がひどい（特に手足）",
  "むくみやすい",
  "不安感や、気分の落ち込みがある",
  "PMS（月経前の不調）が強い",
  "月経量が多い、または長い",
  "食欲がわかない、または食べ過ぎる",
  "氷や、かたいものを噛みたくなる",
  "舌の色が白っぽい、または薄い",
  "健康診断で貧血・鉄不足を指摘されたことがある",
];

const LEVELS = [
  {
    range: [0, 3],
    badge: "Level 0",
    title: "鉄貯蔵は良好です",
    color: "lv0",
    scoreColor: "#6A9A3A",
    barColor: "#6A9A3A",
    desc: "現時点ではほとんど症状がなく、鉄不足の可能性は低い状態です。このまま食事バランスを意識して、良い状態をキープしましょう。",
    advice: [
      "レバー・赤身肉・小松菜など鉄分豊富な食品を週2〜3回意識",
      "ビタミンCと一緒に摂ると吸収率アップ（ブロッコリー・キウイ）",
      "鉄の吸収を妨げるタンニン（濃い緑茶・コーヒー）は食後に",
      "定期的な血液検査でフェリチン値を確認",
    ],
    doctor: "症状が少なくても、フェリチン（貯蔵鉄）は低い場合があります。年に一度は血液検査で確認しておくと安心ですね。",
  },
  {
    range: [4, 7],
    badge: "Level 1",
    title: "軽度の鉄不足サイン",
    color: "lv1",
    scoreColor: "#C8922A",
    barColor: "#C8922A",
    desc: "鉄が少し足りていない状態です。疲れやすさや肌荒れなど、いくつかの不調が出始めているかもしれません。食事と生活改善で整えていきましょう。",
    advice: [
      "赤身肉・レバー・あさり・ひじきを意識して週3回以上摂る",
      "コーヒー・緑茶は食事と一緒に飲まない（30分あける）",
      "植物性鉄（ほうれん草・大豆）はビタミンCと一緒に",
      "睡眠を7時間確保する（鉄は眠っている間に活用される）",
      "血液検査（フェリチン・血清鉄）の受診を検討",
    ],
    doctor: "このくらいの段階で気づくのはとても大切です！食事を整えるだけでぐっと体が楽になる方が多いですよ。焦らずコツコツ養生しましょう。",
  },
  {
    range: [8, 12],
    badge: "Level 2",
    title: "中等度の鉄不足",
    color: "lv2",
    scoreColor: "#E8733A",
    barColor: "#E8733A",
    desc: "鉄不足がかなり進んでいる可能性があります。疲労感・気分の落ち込み・冷え・肌髪のトラブルが重なって起きているなら、早めのケアが必要です。",
    advice: [
      "毎食に鉄分を意識（朝：納豆や卵、昼夕：赤身肉やレバー）",
      "ビタミンC・たんぱく質を一緒に摂る食べ合わせを習慣に",
      "鉄サプリを検討（ヘム鉄タイプが吸収しやすい）",
      "月経量が多い場合は婦人科受診も視野に",
      "医療機関での鉄剤点滴・内服を相談することをおすすめ",
    ],
    doctor: "この段階では食事だけでの改善に時間がかかることも。サプリや医療的なサポートを組み合わせて、無理なく体を立て直していきましょう。",
  },
  {
    range: [13, 18],
    badge: "Level 3",
    title: "高度の鉄不足が疑われます",
    color: "lv3",
    scoreColor: "#D4537E",
    barColor: "#D4537E",
    desc: "多くの症状が重なっていて、鉄不足がかなり深刻な状態の可能性があります。日常生活に影響が出ている場合は、自己ケアだけでなく医療機関への相談をおすすめします。",
    advice: [
      "まず血液検査（フェリチン・血清鉄・TIBC）を受けましょう",
      "医師の処方による鉄剤内服・鉄剤点滴が効果的です",
      "月経過多・子宮筋腫などの原因疾患がないか確認を",
      "鉄吸収を妨げる食品（タンニン・過剰なカルシウム）を控える",
      "体を温める食材（生姜・シナモン・根菜）で血流を支える",
    ],
    doctor: "たくさん辛い思いをしてきたんですね。あなたの不調には、きちんとした理由があります。一人で抱え込まずに、ぜひ医療機関や私たちを頼ってください。",
  },
];

const listEl = document.getElementById('checkList');
const scoreEl = document.getElementById('scoreNum');
const barEl   = document.getElementById('barFill');
const resultCard = document.getElementById('resultCard');
const doctorSection = document.getElementById('doctorSection');

let checked = new Array(18).fill(false);

function getLevel(score) {
  return LEVELS.find(l => score >= l.range[0] && score <= l.range[1]);
}

function update() {
  const score = checked.filter(Boolean).length;
  const pct = (score / 18) * 100;
  const lv = getLevel(score);

  scoreEl.textContent = score;
  scoreEl.style.color = lv.scoreColor;
  barEl.style.width = pct + '%';
  barEl.style.background = lv.barColor;

  // result
  resultCard.className = 'result-card ' + lv.color;
  if (score === 0) {
    resultCard.classList.add('hidden');
    doctorSection.style.display = 'none';

  } else {
    resultCard.classList.remove('hidden');
    document.getElementById('resultBadge').textContent = lv.badge;
    document.getElementById('resultTitle').textContent = lv.title;
    document.getElementById('resultDesc').textContent = lv.desc;
    const advList = document.getElementById('adviceList');
    advList.innerHTML = lv.advice.map(a => `<li>${a}</li>`).join('');
    document.getElementById('doctorText').textContent = lv.doctor;
    doctorSection.style.display = 'flex';

  }
}

// build items
ITEMS.forEach((label, i) => {
  const div = document.createElement('div');
  div.className = 'check-item';
  div.innerHTML = `
    <div class="check-box"><span class="check-mark">✓</span></div>
    <div>
      <div class="check-num">${String(i+1).padStart(2,'0')}</div>
      <div class="check-label">${label}</div>
    </div>`;
  div.addEventListener('click', () => {
    checked[i] = !checked[i];
    div.classList.toggle('checked', checked[i]);
    update();
  });
  listEl.appendChild(div);
});

document.getElementById('resetBtn').addEventListener('click', () => {
  checked.fill(false);
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('checked'));
  update();
});

update();
</script>

</body></html>
